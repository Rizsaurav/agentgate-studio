name: Security
# The project is a security product and must pass its own checks (#23). Every third-party Action is
# pinned by commit SHA; Dependabot keeps the pins current.
on:
  pull_request:
  push:
  schedule:
    # Weekly, so a newly published vulnerability in an unchanged dependency or image is still found.
    - cron: '23 5 * * 1'
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hard-coded secrets in the commits a pull request or push adds. Known test fixtures are listed by
  # fingerprint in .gitleaksignore, so a real key is found anywhere, tests included.
  secrets:
    name: secrets
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Self-test, a planted fake key must be found
        run: |
          mkdir -p "$RUNNER_TEMP/selftest"
          # Random at run time, so no key-shaped string is committed and the value has a real key's
          # entropy (gitleaks ignores low-entropy look-alikes such as AKIAQQQQ...).
          printf 'aws_access_key_id = AKIA%s\n' "$(head -c 256 /dev/urandom | LC_ALL=C tr -dc 'A-Z2-7' | head -c 16)" > "$RUNNER_TEMP/selftest/config"
          if "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/selftest" --no-banner --redact; then
            echo "gitleaks did not find a planted key: the scan is not working."
            exit 1
          fi
      - name: Scan the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --log-opts="$range"

  # Known vulnerabilities in the dependencies the product ships: npm (high and critical) and the
  # scanner's pinned Python stack. A pull request that adds a vulnerable dependency fails. Runs without
  # any repository setting (GitHub's dependency review needs the dependency graph switched on).
  dependencies:
    name: dependencies
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Accepted for now, each with a reason; any other advisory fails. Remove an entry when it is fixed.
      # transformers 4.57.6 is pinned because LLM Guard broke on an unpinned install (scanner/requirements.txt).
      # Fixes for three of these are only in transformers 5.x, and three have no fixed release yet.
      # Moving the scanner to transformers 5.x needs its own verification against the security evals.
      ACCEPTED: >-
        PYSEC-2025-217 PYSEC-2026-2288 PYSEC-2026-2289 PYSEC-2026-2290 PYSEC-2026-3929 PYSEC-2026-4174
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: npm (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Scanner (pinned Python stack)
        run: |
          python -m pip install --quiet pip-audit==2.10.0
          read -ra accepted <<< "$ACCEPTED"
          ignore=()
          for id in "${accepted[@]}"; do ignore+=(--ignore-vuln "$id"); done
          # Every requirement is pinned exactly, so the list is audited as written, without installing it.
          pip-audit -r scanner/requirements.txt --no-deps --disable-pip --progress-spinner off "${ignore[@]}"

  codeql:
    name: codeql (${{ matrix.language }})
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

  # Both images, built the way compose builds them. Fails on critical vulnerabilities that have a fix.
  images:
    name: images
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: app, context: ., file: Dockerfile }
          - { name: scanner, context: scanner, file: scanner/Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build -t "agentgate-${{ matrix.image.name }}:scan" -f "${{ matrix.image.file }}" "${{ matrix.image.context }}"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentgate-${{ matrix.image.name }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # A CycloneDX SBOM of the npm workspace, attached to every published release.
  sbom:
    name: sbom
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate and attach the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > "agentgate-${TAG}.cdx.json"
          gh release upload "$TAG" "agentgate-${TAG}.cdx.json" --clobber
