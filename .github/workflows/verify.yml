name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Required: typecheck, lint, formatting, unit/integration tests, production build.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  # Required: the native Mac app's model manager builds and its unit tests pass.
  mac:
    name: mac
    # macOS 26 ships Swift 6.2, which the terminal (SwiftTerm 1.99) needs; macOS 15 has 6.1.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path mac
      - run: swift test --package-path mac
      - name: TEMP repeat the resume test 30 times
        run: |
          fails=0
          for i in $(seq 1 30); do
            swift test --package-path mac --skip-build --filter resumesAfterDroppedConnection > /tmp/r.txt 2>&1 || { fails=$((fails+1)); grep -m2 "Expectation failed" /tmp/r.txt; }
          done
          echo "RESULT: $fails of 30 runs failed"

  # Required: Promptfoo security and functional suite against the real application pipeline and
  # the real LLM Guard scanner. The model is a scripted fixture: no paid API key is used anywhere.
  security-evals:
    name: security-evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTGATE_SCANNER_URL: http://127.0.0.1:8765
      # CPU-only PyTorch wheels (the default Linux wheels bundle gigabytes of CUDA libraries).
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-llm-guard-${{ hashFiles('scanner/requirements.txt') }}
      - run: npm ci
      - run: PYTHON=python sh scanner/setup.sh
      - name: Start the scanner
        run: |
          nohup scanner/.venv/bin/python scanner/server.py > scanner.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:8765/health && exit 0
            sleep 2
          done
          cat scanner.log
          exit 1
      - name: Tests including live scanner integration
        run: npx vitest run
      - name: Required evaluation suite (must pass)
        run: |
          mkdir -p eval-results
          npm run eval -- -o ../eval-results/enforced.json
      - name: Weak-configuration check (must FAIL, proving the suite detects regressions)
        run: |
          if npm run eval:weak -- -o ../eval-results/weak-demo.json; then
            echo "The deliberately weak configuration passed: the suite no longer detects regressions."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: eval-results/
          if-no-files-found: ignore

  # Required: the one-command Docker stack still works. Builds both images, starts the stack the way
  # a teammate does, and runs the required evaluation suite inside the app container against the
  # scanner container (a scripted task is answered, a prompt injection is blocked). GitHub's runners
  # are amd64, so this also covers the platform the Docker setup was not verified on.
  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE: docker compose -f compose.yaml -f .github/compose.ci.yaml
      HF_CACHE: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid, with and without the ollama profile
        run: |
          docker compose config --quiet
          docker compose --profile ollama config --quiet
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: compose-huggingface-llm-guard-${{ hashFiles('scanner/requirements.txt') }}
      - name: Let the scanner container (uid 1000) use the cache
        run: mkdir -p "$HF_CACHE" && chmod -R a+rwX "$HF_CACHE"
      - name: Build and start the stack (first run downloads the scanner model)
        run: $COMPOSE up --detach --build --wait --wait-timeout 900
      - name: Image sizes
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep agentgate
      - name: Only the app port is published, and only on loopback
        run: |
          $COMPOSE ps --format json | node -e '
            const lines = require("fs").readFileSync(0, "utf8").trim().split("\n");
            const published = lines.flatMap((line) => JSON.parse(line).Publishers ?? [])
              .filter((p) => p.PublishedPort > 0);
            console.log(JSON.stringify(published));
            const ok = published.length === 1 && published[0].URL === "127.0.0.1"
              && published[0].TargetPort === 3000;
            if (!ok) { console.error("Expected exactly 127.0.0.1:3000 to be published."); process.exit(1); }'
      - name: The app answers
        run: |
          curl -sf -o /dev/null http://127.0.0.1:3000/models
          curl -sf -o /dev/null http://127.0.0.1:3000/api/models/pull
      - name: Required evaluation suite inside the app container, against the scanner container
        run: $COMPOSE exec -T --workdir /app app npm run eval
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Stop and remove the stack
        if: always()
        run: $COMPOSE down --volumes
