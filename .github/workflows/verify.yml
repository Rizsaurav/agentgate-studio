name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Required: typecheck, lint, formatting, unit/integration tests, production build.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  # Required: the native Mac app's model manager builds and its unit tests pass.
  mac:
    name: mac
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path mac
      - run: swift test --package-path mac

  # Required: Promptfoo security and functional suite against the real application pipeline and
  # the real LLM Guard scanner. The model is a scripted fixture: no paid API key is used anywhere.
  security-evals:
    name: security-evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTGATE_SCANNER_URL: http://127.0.0.1:8765
      # CPU-only PyTorch wheels (the default Linux wheels bundle gigabytes of CUDA libraries).
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-llm-guard-${{ hashFiles('scanner/requirements.txt') }}
      - run: npm ci
      - run: PYTHON=python sh scanner/setup.sh
      - name: Start the scanner
        run: |
          nohup scanner/.venv/bin/python scanner/server.py > scanner.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:8765/health && exit 0
            sleep 2
          done
          cat scanner.log
          exit 1
      - name: Tests including live scanner integration
        run: npx vitest run
      - name: Required evaluation suite (must pass)
        run: |
          mkdir -p eval-results
          npm run eval -- -o ../eval-results/enforced.json
      - name: Weak-configuration check (must FAIL, proving the suite detects regressions)
        run: |
          if npm run eval:weak -- -o ../eval-results/weak-demo.json; then
            echo "The deliberately weak configuration passed: the suite no longer detects regressions."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: eval-results/
          if-no-files-found: ignore
