# REQUIRED suite: the application's pipeline with every protection enforced.
# Run by `npm run eval`, the dashboard worker, and GitHub Actions.
description: AGENTGATE required functional and security regression suite
providers:
  - id: file://provider.ts
    label: agentgate-pipeline (enforced)
    config:
      profile: enforced
prompts:
  - '{{question}}'
tests: file://tests/cases.yaml
# The scanner checks one batch at a time, so parallel cases only queue behind each other and can hit
# its client timeout, which fails closed and reads as a test failure.
evaluateOptions:
  maxConcurrency: 1
